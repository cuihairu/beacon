name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
jobs:
  build-test:
    runs-on: ${{ vars.CI_RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Beacon.sln -c Release

      - name: Test
        run: dotnet test Beacon.sln -c Release --no-build --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: TestResults/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
