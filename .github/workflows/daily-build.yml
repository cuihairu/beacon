name: Daily Build

# Beacon 每日构建交付面：windows-latest 上 dotnet publish 出 WinUI 3 自包含包
# （unpackaged，RFC §10），发布固定 tag `nightly` 的滚动 Release——资产清旧传新、
# 附 SHA256SUMS 全量校验单。Release 资产是硬交付面，Actions artifacts 只是
# run 页临时下载（14 天过期），本工作流不依赖它。
#
# 发布机制：tag 固定 `nightly` 不动，每次发布**删旧 release 连 tag 一并重建**
# （delete --cleanup-tag → create --target=本次 SHA）——release publishedAt 恒等
# 于本次构建时间，时间戳即交付凭证（复用 release 对象换资产的方式 publishedAt
# 停在首次发布日，装机验收无法凭它确认装到新包）。发布步骤末尾带硬断言：
# publishedAt / 三个资产 updatedAt 必须 ≥ 本次 run 起始时间，远端 SHA256SUMS 须与
# 本地构建逐字节一致——发布失败=run 红，不许绿着不发货。--prerelease
# --latest=false 保证滚动构建永不冒充正式版。仓库红线是「禁版本 tag」；
# `nightly` 是固定滚动 tag，不是版本号，不受限。
#
# 调度：GitHub schedule 只在默认分支（main）生效；北京时间凌晨执行。

on:
  schedule:
    # UTC 19:07 = 北京时间 03:07（凌晨），避开整点调度高峰
    - cron: '7 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build-publish:
    name: Build & publish nightly (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/Beacon.App/Beacon.App.csproj -c Release -r win-x64 --self-contained true -o publish

      # 真机冒烟（B-803 的 CI 化）：发布产物在本机真启动 30s——进程存活 + 日志出现
      # 「Beacon started」才算过。启动即崩在这里红，事件查看器的 .NET Runtime 条目直接给堆栈。
      - name: Smoke test (boot the unpackaged app on this runner)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/Beacon.App.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          $log = Get-ChildItem "$env:APPDATA\Beacon\logs" -Filter "beacon-*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) {
            Write-Host "--- 启动日志：$($log.Name)"
            Get-Content $log.FullName | Select-Object -Last 40 | Write-Host
          }
          $crashDump = {
            Get-WinEvent -LogName Application -MaxEvents 120 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } |
              Select-Object -First 8 | ForEach-Object { Write-Host "=== $($_.TimeCreated) [$($_.ProviderName)]"; Write-Host $_.Message }
          }
          if (!$alive) {
            Write-Host "::error::冒烟测试失败：Beacon.App 启动即退出"
            & $crashDump
            exit 1
          }
          $started = $log -and (Select-String -Path $log.FullName -Pattern 'Beacon started' -Quiet)
          if (!$started) {
            Write-Host "::error::冒烟测试失败：进程存活但 30s 内未见启动完成标记（Beacon started）"
            & $crashDump
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "冒烟测试通过：进程存活且日志含启动完成标记"

      - name: Pack (zip)
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "beacon-nightly-windows-x86_64.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # 向导中文语言包与 DPI 修复需要 Inno 6.5+，强制升到最新稳定（choco 无则装、旧则升）
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "0.0." + (Get-Date -Format "yyyyMMdd")
          & $iscc "/DMyAppVersion=$version" "/DMyCommit=$env:GITHUB_SHA" packaging\beacon.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP=beacon-nightly-windows-x86_64.zip
          SETUP=beacon-nightly-windows-x86_64-setup.exe
          sha256sum "$ZIP" "$SETUP" > SHA256SUMS
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sz="$(du -h "$ZIP" | cut -f1)"
          szs="$(du -h "$SETUP" | cut -f1)"
          {
            echo "滚动每日构建（rolling nightly）。tag 固定 \`nightly\`，资产随最新 main 清旧传新——本页永远对应当前主干。"
            echo
            echo "- 构建时间：${stamp}"
            echo "- Commit：\`${GITHUB_SHA}\`"
            echo "- 工作流：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## 资产"
            echo
            echo "| 资产 | 大小 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| \`${ZIP}\` | ${sz} | Windows x86_64 自包含便携包（含 .NET 10 + Windows App SDK 运行时） |"
            echo "| \`${SETUP}\` | ${szs} | Windows 安装包（Inno Setup；装到 %LOCALAPPDATA%\\Beacon，无需管理员） |"
            echo "| \`SHA256SUMS\` | - | 全部资产 sha256 清单 |"
            echo
            echo "## 校验"
            echo
            echo "资产与 \`SHA256SUMS\` 放同一目录后（PowerShell）："
            echo
            echo "    Get-FileHash ${ZIP} -Algorithm SHA256   # 与 SHA256SUMS 逐行比对"
            echo "    # 装了 Git Bash 也可：sha256sum -c SHA256SUMS"
            echo
            echo "## 说明"
            echo
            echo "- 自包含（self-contained）：无需安装 .NET 运行时，解压后直接运行 \`Beacon.App.exe\`。"
            echo "- 安装包与便携 zip 内容相同：开始菜单启动，可选桌面快捷方式与开机自启；卸载走系统「添加或删除程序」。"
            echo "- 产物未签名：首次运行 SmartScreen 可能提示，选「仍要运行」。"
            echo "- 每日构建只证明可构建 + 打包成功；完整质量门禁以仓库 CI（ci.yml）为准。"
          } > notes.md
          TAG=nightly
          # 滚动 release 每次删旧重建（连 tag）：publishedAt=本次 run，时间戳即交付凭证。
          # concurrency 已串行化同一 job，无并发互踩；delete 不存在时容许失败（首跑）。
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Nightly · 每日构建 ${stamp}" --notes-file notes.md \
            --prerelease --latest=false
          gh release upload "$TAG" "$ZIP" "$SETUP" SHA256SUMS

          # ── 发布后硬断言：任一不过=本步失败（发布失败必须红，不许绿着不发货）──
          # ①publishedAt 与三个资产 updatedAt 必须 ≥ 本次 run 起始（同为 ISO8601 UTC，字典序可比）；
          # ②远端 SHA256SUMS 下载回来与本地 diff——发出的就是本次构建的硬证明。
          sleep 5
          view="$(gh release view "$TAG" --json publishedAt,assets)"
          pub="$(echo "$view" | jq -r '.publishedAt')"
          started="${{ github.run_started_at }}"
          if [[ -z "$pub" || "$pub" < "$started" ]]; then
            echo "::error::发布断言失败：Release publishedAt=${pub:-空} 早于本次 run 起始 ${started}——新 release 未建成"
            exit 1
          fi
          for f in "$ZIP" "$SETUP" SHA256SUMS; do
            ts="$(echo "$view" | jq -r --arg n "$f" '.assets[] | select(.name == $n) | .updatedAt')"
            if [[ -z "$ts" || "$ts" < "$started" ]]; then
              echo "::error::发布断言失败：资产 ${f} 缺失或 updatedAt=${ts:-空} 早于本次 run 起始 ${started}"
              exit 1
            fi
          done
          gh release download "$TAG" -p SHA256SUMS -O /tmp/SHA256SUMS.remote --clobber
          if ! diff -u SHA256SUMS /tmp/SHA256SUMS.remote; then
            echo "::error::发布断言失败：远端 SHA256SUMS 与本次构建不一致——传错/传漏资产"
            exit 1
          fi
          echo "发布断言通过：publishedAt=${pub}，三资产时间戳均为本次 run，SHA256SUMS 与本地构建一致"
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
