name: Daily Build

# Beacon 每日构建交付面：windows-latest 上 dotnet publish 出 WinUI 3 自包含包
# （unpackaged，RFC §10），发布固定 tag `nightly` 的滚动 Release——资产清旧传新、
# 附 SHA256SUMS 全量校验单。Release 资产是硬交付面，Actions artifacts 只是
# run 页临时下载（14 天过期），本工作流不依赖它。
#
# 发布机制：tag 固定 `nightly` 不动，每次发布**删旧 release 连 tag 一并重建**
# （delete --cleanup-tag → create --target=本次 SHA）——release publishedAt 恒等
# 于本次构建时间，时间戳即交付凭证（复用 release 对象换资产的方式 publishedAt
# 停在首次发布日，装机验收无法凭它确认装到新包）。发布步骤末尾带硬断言：
# publishedAt / 三个资产 updatedAt 必须 ≥ 本次 run 起始时间，远端 SHA256SUMS 须与
# 本地构建逐字节一致——发布失败=run 红，不许绿着不发货。--prerelease
# --latest=false 保证滚动构建永不冒充正式版。仓库红线是「禁版本 tag」；
# `nightly` 是固定滚动 tag，不是版本号，不受限。
#
# 调度：GitHub schedule 只在默认分支（main）生效；北京时间凌晨执行。

on:
  schedule:
    # UTC 19:07 = 北京时间 03:07（凌晨），避开整点调度高峰
    - cron: '7 19 * * *'
  workflow_dispatch:
  push:
    # 版本 tag（v*）= 自动构建并把产物传到该 tag 的 release（资产名带版本号，
    # 说明文字保留作者手写内容，不删不重建）。nightly 仍走 schedule/手动。
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build-publish:
    name: Build & publish nightly (windows-x86_64)
    runs-on: ${{ vars.CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 90
    # SignPath 代码签名凭据：api-token 与 organization-id 走仓库 Secrets
    # （SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID，均已配置），绝不硬编码。
    # secrets 未配置时版本通道打印提示并跳过签名、发布未签名资产（run 不红）；
    # 已配置时签名步真实执行，失败即红（fail closed，不静默发未签名正式版）。
    # 政策见 README「Code signing policy」与 docs/store-submission.md。
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      # 通道与版本：版本 tag -> 正式版（版本号取 tag，资产名带版本）；
      # 否则 -> 滚动 nightly（版本号=日期 yyyy.M.d，资产名带 nightly）。
      - name: Resolve channel & version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # started = 本 job 起始时刻（UTC ISO8601），发布断言拿它对齐资产时间戳。
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            {
              echo "channel=release"
              echo "version=$v"
              echo "asset=beacon-$v-windows-x86_64"
              echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=nightly"
              echo "version=$(date -u +%Y.%-m.%-d)"
              echo "asset=beacon-nightly-windows-x86_64"
              echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained win-x64)
        shell: pwsh
        # 版本盖进 exe（yyyy.M.d，InformationalVersion=+commit）——设置页「关于」据此显示，
        # 装机排障可自查构建日期与提交。此前 0.0.yyyyMMdd 触发 CS7034（AssemblyVersion
        # 每段 ≤65535，日期八位数超限）——四段日期方案（2026.10.9）全部合规且可读可排序。
        env:
          BEACON_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $version = $env:BEACON_VERSION
          dotnet publish src/Beacon.App/Beacon.App.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=$version "-p:InformationalVersion=$version+$env:GITHUB_SHA"

      # 真机冒烟（B-803 的 CI 化）：发布产物在本机真启动 30s——进程存活 + 日志出现
      # 「Beacon started」才算过。启动即崩在这里红，事件查看器的 .NET Runtime 条目直接给堆栈。
      - name: Smoke test (boot the unpackaged app on this runner)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/Beacon.App.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          $log = Get-ChildItem "$env:APPDATA\Beacon\logs" -Filter "beacon-*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) {
            Write-Host "--- 启动日志：$($log.Name)"
            Get-Content $log.FullName | Select-Object -Last 40 | Write-Host
          }
          $crashDump = {
            Get-WinEvent -LogName Application -MaxEvents 120 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } |
              Select-Object -First 8 | ForEach-Object { Write-Host "=== $($_.TimeCreated) [$($_.ProviderName)]"; Write-Host $_.Message }
          }
          if (!$alive) {
            Write-Host "::error::冒烟测试失败：Beacon.App 启动即退出"
            & $crashDump
            exit 1
          }
          $started = $log -and (Select-String -Path $log.FullName -Pattern 'Beacon started' -Quiet)
          if (!$started) {
            Write-Host "::error::冒烟测试失败：进程存活但 30s 内未见启动完成标记（Beacon started）"
            & $crashDump
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "冒烟测试通过：进程存活且日志含启动完成标记"

      - name: Pack (zip)
        shell: pwsh
        env:
          ASSET: ${{ steps.ver.outputs.asset }}
        run: Compress-Archive -Path "publish/*" -DestinationPath "$env:ASSET.zip"

      # 安装包先于视觉取证产出：场景 J（静默安装/卸载，B-803 CI 代验）需要 setup.exe 在场。
      # ISCC 输出文件名固定（beacon-nightly-…-setup，beacon.iss OutputBaseFilename），
      # 版本 tag 通道资产名带版本号——重命名对齐，否则版本通道发布步骤找不到 $ASSET-setup.exe。
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          BEACON_VERSION: ${{ steps.ver.outputs.version }}
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          # 向导中文语言包与 DPI 修复需要 Inno 6.5+，强制升到最新稳定（choco 无则装、旧则升）
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = $env:BEACON_VERSION
          & $iscc "/DMyAppVersion=$version" "/DMyCommit=$env:GITHUB_SHA" packaging\beacon.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Join-Path (Get-Location) "beacon-nightly-windows-x86_64-setup.exe"
          $wanted = "$env:ASSET-setup.exe"
          if ((Test-Path $built) -and ($built -ne (Join-Path (Get-Location) $wanted)))
          {
            Move-Item $built $wanted -Force
          }
          if (!(Test-Path $wanted)) { throw "安装包未产出：$wanted" }
          Write-Host "安装包就位：$wanted"

      # 视觉取证（2026-10-09 bug 批验收硬标准：没截图不算完）。场景一览：
      # A=数量悬浮窗开（品牌 icon 近景截图）；B=数量悬浮窗关（桌面零残留窗，硬断言）；
      # C=浅色主题 icon 可辨度（白桌面+暗像素硬断言）；D=四家 Provider 连接链（本地 mock+
      # DPAPI 密钥+设置页 UIA：逐家「测试」硬断言「连接正常」+组件下拉有该项+保存即时进下拉）；
      # E=单实例+托盘驻留（副实例退出进程数恒 1、关窗不退进程、托盘菜单 Exit 唯一退出）；
      # F=无网启动（缓存优先+「Last update」标注+恢复自愈+断网零弹窗+降级通知恰 1 条）；
      # G=调色/动效（colorOverride 仅该 tile、非法色回退不崩且重启保持、设置改色即时生效落盘、
      # 重置默认还原、动效档持久化重启恢复选中、off 档全静止/full 档呼吸帧差分断言、状态翻档两 tile 独立）；
      # H=悬浮位置还原（FloatingX/Y 两轮重启精确落位、TOOLWINDOW 置位不进 Alt-Tab、
      # 刷新不抢焦点、panel/floating 二选一）；
      # K=全局热键 Ctrl+Alt+B 唤起快速面板（SendInput 和弦）+ 断网打开走缓存无白屏 + Esc 键盘关闭；
      # J=静默安装/卸载（setup.exe /VERYSILENT 装卸，程序文件清空、用户数据保留）。
      # 断言失败=红构建不发版——渲染、连接链与常驻行为回归从此在这里现形。
      - name: Visual evidence (tile icon + providers + zero-residue screenshots)
        shell: pwsh
        run: .github/workflows/scripts/visual-evidence.ps1

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-evidence
          path: evidence/

      # ── SignPath 代码签名（仅版本 tag 通道；nightly 永不签名）──
      # 链路：未签名 zip+exe → upload-artifact 拿 artifact-id → SignPath 提交签名
      # （wait-for-completion）→ 签好的文件落回 signed/ → 发布步骤优先用 signed/ 的。
      # 参数真值（2026-10-12 用户提供）：
      #   api-token / organization-id  走仓库 Secrets（不硬编码）
      #   project-slug: beacon、signing-policy-slug: beacon
      #   artifact-configuration-slug  可选参数，省略 = 用项目默认 Artifact Configuration
      #     （用户在控制台建 Portable Executable + deep signing 配置后，如需指定再回来填）
      # 用户侧待办（不由 CI 代做）：在 SignPath 控制台把 API token 所属用户加进
      # signing policy「beacon」的 Submitters 列表；未做前版本 tag 构建会在签名步红（fail closed）。
      - name: Upload unsigned assets for signing
        if: ${{ steps.ver.outputs.channel == 'release' && env.SIGNPATH_API_TOKEN != '' }}
        id: sign-upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-assets
          path: |
            ${{ steps.ver.outputs.asset }}.zip
            ${{ steps.ver.outputs.asset }}-setup.exe

      - name: Submit to SignPath
        if: ${{ steps.ver.outputs.channel == 'release' && env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: beacon
          signing-policy-slug: beacon
          # artifact-configuration-slug 为可选参数，省略 = 用项目默认 Artifact Configuration
          # （用户在控制台建 Portable Executable + deep signing 配置后，如需指定再回来填）
          github-artifact-id: ${{ steps.sign-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: Report signing status
        if: ${{ steps.ver.outputs.channel == 'release' }}
        shell: bash
        run: |
          if [[ -n "${SIGNPATH_API_TOKEN}" && -d signed && -n "$(ls -A signed 2>/dev/null)" ]]; then
            echo "SignPath 签名完成：signed/ 内为签名后资产，发布将使用签名件"
          else
            echo "::notice::SignPath secrets 未配置（或签名被跳过）——本次发布未签名资产；签名政策见 README「Code signing policy」"
          fi

      # ── MSIX 打包（仅版本 tag 通道；商店前置产物，不阻发布）──
      # 应用本体仍是 unpackaged 自包含（RFC §10），这里把 publish 输出整体包成 MSIX：
      # 包内 Identity 提供商店所需标识。打包失败只降级为 warning（发布继续、无 .msix），
      # 卡点如实记录在 docs/store-submission.md——不许假装完成。
      - name: Pack MSIX (store submission package)
        if: ${{ steps.ver.outputs.channel == 'release' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          # MSIX 版本必须四段且与 v* tag 对齐（v0.1.3 -> 0.1.3.0）
          $msixVersion = "$env:VERSION.0"
          $msixOutput = "$env:ASSET.msix"
          try {
            & .github\workflows\scripts\msix-pack.ps1 -Version $msixVersion -Output $msixOutput
          } catch {
            Write-Host "::warning::MSIX 打包失败：$($_.Exception.Message)——本次发布不含 .msix（商店前置产物，不阻发布；卡点记录见 docs/store-submission.md）"
          }

      # 发布：nightly 通道删旧重建（publishedAt=本次 run）；版本 tag 通道只传资产、
      # 不删不重建——作者手写的 release 说明原样保留。两条通道共用发布后硬断言。
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          set -euo pipefail
          ZIP="${ASSET}.zip"
          SETUP="${ASSET}-setup.exe"
          MSIX="${ASSET}.msix"
          # SignPath 签名产物优先：signed/ 里有签好的就用签好的；secrets 未配置时
          # signed/ 不存在 → 用未签名原件（签名步骤已打印提示，run 不红）
          ZIP_SRC="$ZIP"
          SETUP_SRC="$SETUP"
          [[ -f "signed/$ZIP" ]] && ZIP_SRC="signed/$ZIP"
          [[ -f "signed/$SETUP" ]] && SETUP_SRC="signed/$SETUP"
          # MSIX 仅版本 tag 通道产出；打包失败已降级 warning，按实际存在与否纳入资产
          MSIX_SRC=""
          [[ "$CHANNEL" == "release" && -f "$MSIX" ]] && MSIX_SRC="$MSIX"

          if [[ -n "$MSIX_SRC" ]]; then
            sha256sum "$ZIP_SRC" "$SETUP_SRC" "$MSIX_SRC" > SHA256SUMS
          else
            sha256sum "$ZIP_SRC" "$SETUP_SRC" > SHA256SUMS
          fi
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sz="$(du -h "$ZIP_SRC" | cut -f1)"
          szs="$(du -h "$SETUP_SRC" | cut -f1)"

          if [[ "$CHANNEL" == "release" ]]; then
            TAG="v${VERSION}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            fi
            if [[ -n "$MSIX_SRC" ]]; then
              gh release upload "$TAG" "$ZIP_SRC" "$SETUP_SRC" "$MSIX_SRC" SHA256SUMS --clobber
            else
              gh release upload "$TAG" "$ZIP_SRC" "$SETUP_SRC" SHA256SUMS --clobber
            fi
            if [[ -n "${SIGNPATH_API_TOKEN}" && -f "signed/$ZIP" ]]; then signed="已签名"; else signed="未签名"; fi
            echo "版本发布：$TAG（说明文字不动，仅上传资产；签名=${signed}，MSIX=$([[ -n "$MSIX_SRC" ]] && echo 已含 || echo 未含)）"
          else
            TAG=nightly
            {
              echo "滚动每日构建（rolling nightly）。tag 固定 \`nightly\`，资产随最新 main 清旧传新——本页永远对应当前主干。"
              echo
              echo "- 构建时间：${stamp}"
              echo "- Commit：\`${GITHUB_SHA}\`"
              echo "- 工作流：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "## 资产"
              echo
              echo "| 资产 | 大小 | 说明 |"
              echo "| --- | --- | --- |"
              echo "| \`${ZIP}\` | ${sz} | Windows x86_64 自包含便携包（含 .NET 10 + Windows App SDK 运行时） |"
              echo "| \`${SETUP}\` | ${szs} | Windows 安装包（Inno Setup；装到 %LOCALAPPDATA%\\Beacon，无需管理员） |"
              echo "| \`SHA256SUMS\` | - | 全部资产 sha256 清单 |"
              echo
              echo "## 校验"
              echo
              echo "资产与 \`SHA256SUMS\` 放同一目录后（PowerShell）："
              echo
              echo "    Get-FileHash ${ZIP} -Algorithm SHA256   # 与 SHA256SUMS 逐行比对"
              echo "    # 装了 Git Bash 也可：sha256sum -c SHA256SUMS"
              echo
              echo "## 说明"
              echo
              echo "- 自包含（self-contained）：无需安装 .NET 运行时，解压后直接运行 \`Beacon.App.exe\`。"
              echo "- 安装包与便携 zip 内容相同：开始菜单启动，可选桌面快捷方式与开机自启；卸载走系统「添加或删除程序」。"
              echo "- 产物未签名（nightly 永不签名）：首次运行 SmartScreen 可能提示，选「仍要运行」。正式版签名政策：Free code signing provided by SignPath.io, certificate by SignPath Foundation（见 README「Code signing policy」）。"
              echo "- 每日构建只证明可构建 + 打包成功；完整质量门禁以仓库 CI（ci.yml）为准。"
            } > notes.md
            # 滚动 release 每次删旧重建（连 tag）：时间戳即交付凭证；concurrency 已串行化。
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Nightly · 每日构建 ${stamp}" --notes-file notes.md \
              --prerelease --latest=false
            gh release upload "$TAG" "$ZIP_SRC" "$SETUP_SRC" SHA256SUMS
          fi

          # ── 发布后硬断言：任一不过=本步失败（发布失败必须红，不许绿着不发货）──
          # ①nightly 通道 publishedAt 必须 ≥ 本次 run 起始；②各资产 updatedAt 必须 ≥ 起始；
          # ③远端 SHA256SUMS 下载回来与本地 diff——发出的就是本次构建的硬证明。
          sleep 5
          view="$(gh release view "$TAG" --json publishedAt,assets)"
          started="${{ steps.ver.outputs.started }}"
          if [[ "$CHANNEL" == "nightly" ]]; then
            pub="$(echo "$view" | jq -r '.publishedAt')"
            if [[ -z "$pub" || "$pub" < "$started" ]]; then
              echo "::error::发布断言失败：Release publishedAt=${pub:-空} 早于本次 run 起始 ${started}——新 release 未建成"
              exit 1
            fi
          fi
          ASSERT_ASSETS="$ZIP $SETUP SHA256SUMS"
          [[ -n "$MSIX_SRC" ]] && ASSERT_ASSETS="$ASSERT_ASSETS $MSIX"
          for f in $ASSERT_ASSETS; do
            ts="$(echo "$view" | jq -r --arg n "$f" '.assets[] | select(.name == $n) | .updatedAt')"
            if [[ -z "$ts" || "$ts" < "$started" ]]; then
              echo "::error::发布断言失败：资产 ${f} 缺失或 updatedAt=${ts:-空} 早于本次 run 起始 ${started}"
              exit 1
            fi
          done
          gh release download "$TAG" -p SHA256SUMS -O /tmp/SHA256SUMS.remote --clobber
          if ! diff -u SHA256SUMS /tmp/SHA256SUMS.remote; then
            echo "::error::发布断言失败：远端 SHA256SUMS 与本次构建不一致——传错/传漏资产"
            exit 1
          fi
          echo "发布断言通过：TAG=${TAG}，资产时间戳均为本次 run，SHA256SUMS 与本地构建一致"
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
